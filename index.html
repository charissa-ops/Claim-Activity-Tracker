<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Activity Docket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy: #1B2A4A;
    --navy-light: #2C4066;
    --parchment: #EFE7D8;
    --parchment-dark: #E0D4BC;
    --cream: #FAF7F0;
    --amber: #B8863C;
    --amber-light: #D4A857;
    --ink: #2A2E35;
    --ink-soft: #5A6270;
    --line: #D8CCB0;
    --red: #A8452F;
    --green: #4B6E4E;

    --cat-email: #3E6B8A;
    --cat-received: #5C8A8A;
    --cat-demand: #A8452F;
    --cat-spol: #7A5C9E;
    --cat-litigation: #B8863C;
    --cat-appraisal: #4B6E4E;
    --cat-carrier: #2C4066;
    --cat-sfupload: #7A6A4F;
    --cat-other: #6B6355;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  /* Header */
  header.top{
    display:flex;align-items:flex-end;justify-content:space-between;
    border-bottom:2px solid var(--navy);
    padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--amber);font-weight:600;
  }
  .brand h1{
    font-family:'Source Serif 4',serif;font-size:28px;margin:0;color:var(--navy);
    font-weight:700;letter-spacing:-.01em;
  }
  .date-nav{display:flex;align-items:center;gap:8px;}
  .date-nav button{
    background:none;border:1px solid var(--line);color:var(--navy);
    width:32px;height:32px;border-radius:4px;cursor:pointer;font-size:15px;
  }
  .date-nav button:hover{background:var(--parchment);}
  .date-display{
    font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink);
    min-width:150px;text-align:center;
  }
  .date-display .today-pill{
    display:inline-block;margin-left:6px;font-size:10px;background:var(--navy);
    color:#fff;padding:1px 6px;border-radius:10px;letter-spacing:.05em;
  }

  /* Staff tabs */
  .staff-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .staff-tab{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.03em;
    background:#fff;border:1px solid var(--line);color:var(--ink-soft);
    padding:7px 16px;border-radius:20px;cursor:pointer;transition:all .12s;
  }
  .staff-tab:hover{border-color:var(--amber-light);}
  .staff-tab.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;}

  /* View tabs */
  .tabs{display:flex;align-items:center;gap:2px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tabs button{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.05em;
    text-transform:uppercase;background:none;border:none;padding:9px 4px;
    margin-right:22px;color:var(--ink-soft);cursor:pointer;position:relative;
    border-bottom:2px solid transparent;top:1px;
  }
  .tabs button.active{color:var(--navy);border-bottom-color:var(--amber);font-weight:600;}

  /* Tally strip */
  .tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-bottom:22px;}
  .tally-card{
    background:#fff;border:1px solid var(--line);border-left:3px solid var(--cat-color,var(--navy));
    border-radius:3px;padding:10px 12px;cursor:pointer;transition:transform .1s;
  }
  .tally-card:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(27,42,74,.08);}
  .tally-card.active{background:var(--parchment);}
  .tally-card .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--navy);}
  .tally-card .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

  /* Quick add */
  .docket-panel{background:#fff;border:1px solid var(--line);border-radius:5px;margin-bottom:20px;}
  .panel-head{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-soft);padding:10px 16px;border-bottom:1px solid var(--line);background:var(--parchment);
    border-radius:5px 5px 0 0;
  }
  .add-form{display:flex;flex-wrap:wrap;gap:10px;padding:14px 16px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  select, input[type=text], input[type=number], input[type=date]{
    font-family:'Inter',sans-serif;font-size:13px;padding:7px 9px;border:1px solid var(--line);
    border-radius:3px;background:var(--cream);color:var(--ink);
  }
  select:focus, input:focus{outline:2px solid var(--amber-light);outline-offset:1px;}
  .field.grow{flex:1;min-width:200px;}
  .field.count input{width:64px;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;background:var(--navy);color:#fff;
    border:none;padding:8px 18px;border-radius:3px;cursor:pointer;
  }
  .btn:hover{background:var(--navy-light);}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-soft);}
  .btn.ghost:hover{background:var(--parchment);}
  .btn.small{padding:4px 10px;font-size:12px;}

  /* Docket list */
  .docket-list{list-style:none;margin:0;padding:0;}
  .docket-list li{
    display:grid;grid-template-columns:44px 90px 1fr auto auto;gap:12px;align-items:center;
    padding:11px 16px;border-bottom:1px solid var(--line);font-size:13.5px;
  }
  .docket-list li:last-child{border-bottom:none;}
  .docket-list li:hover{background:var(--cream);}
  .idx{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:12px;}
  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.03em;
    text-transform:uppercase;color:#fff;background:var(--cat-color,var(--navy));
    padding:3px 7px;border-radius:3px;text-align:center;white-space:nowrap;
  }
  .desc{color:var(--ink);}
  .desc .src{color:var(--ink-soft);font-size:11px;margin-left:6px;font-style:italic;}
  .state-tag{
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--navy);
    background:var(--parchment);border:1px solid var(--line);padding:1px 6px;border-radius:3px;margin-left:4px;
  }
  .cnt{font-family:'IBM Plex Mono',monospace;color:var(--navy);font-weight:600;font-size:13px;}
  .del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;padding:2px 6px;}
  .del:hover{color:var(--red);}
  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state .stamp{font-family:'Source Serif 4',serif;font-size:16px;color:var(--navy);margin-bottom:6px;}

  /* Week view */
  .week-grid{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;padding:18px 16px;}
  .week-row-label{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);align-self:center;}
  .week-bars{display:flex;gap:4px;align-items:flex-end;height:26px;}
  .week-bars .seg{border-radius:2px;height:100%;}
  .week-total{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);margin-left:8px;align-self:center;}
  .week-legend{display:flex;flex-wrap:wrap;gap:10px 16px;padding:0 16px 16px;border-top:1px solid var(--line);padding-top:12px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
  .legend-dot{width:9px;height:9px;border-radius:2px;}

  /* By Day table */
  .byday-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .byday-table th, .byday-table td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  .byday-table th{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;position:sticky;top:0;background:var(--cream);
  }
  .byday-table td:first-child, .byday-table th:first-child{text-align:left;font-family:'IBM Plex Mono',monospace;color:var(--navy);font-weight:600;}
  .byday-table tr:hover td{background:var(--parchment);}
  .byday-table .total-col{font-weight:700;color:var(--navy);border-left:2px solid var(--line);}
  .byday-scroll{overflow-x:auto;}

  /* Login screen */
  .login-screen{
    min-height:70vh;display:flex;align-items:center;justify-content:center;
  }
  .login-box{
    background:#fff;border:1px solid var(--line);border-radius:6px;padding:32px 36px;
    width:100%;max-width:340px;box-shadow:0 4px 16px rgba(27,42,74,.06);
  }
  .login-box h1{font-family:'Source Serif 4',serif;font-size:22px;color:var(--navy);margin:0 0 4px;}
  .login-box .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;}
  .login-box .field{margin-bottom:12px;}
  .login-box input{width:100%;}
  .login-box .btn{width:100%;margin-top:6px;}
  .login-error{color:var(--red);font-size:12px;margin-top:10px;min-height:14px;}
  .staff-label-chip{
    font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--navy);color:#fff;
    padding:6px 16px;border-radius:20px;display:inline-block;margin-bottom:16px;
  }
  .logout-link{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
    background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;
  }

  /* Category add row */
  .cat-add-row{display:flex;gap:6px;margin-top:4px;}
  .cat-add-row input{flex:1;}
  .cat-add-row.hidden{display:none;}
  /* Report panel */
  .report-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px 16px;}
  .report-output{
    box-sizing:border-box;margin:0 16px 16px;width:calc(100% - 32px);
    min-height:220px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.5;
    padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--cream);color:var(--ink);
    resize:vertical;
  }
  .copy-confirm{font-size:11.5px;color:var(--green);font-family:'IBM Plex Mono',monospace;}
  .hidden{display:none !important;}

  .sync-bar{
    display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);
    margin-bottom:14px;font-family:'IBM Plex Mono',monospace;
  }
  .sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;}
  .sync-dot.ok{background:var(--green);}
  .sync-dot.off{background:var(--red);}

  @media(max-width:600px){
    .docket-list li{grid-template-columns:30px 70px 1fr auto;grid-template-areas:"idx cat desc del" "idx cat cnt del";}
    .cnt{grid-column:3;justify-self:start;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>Claim Activity Docket</h1>
      <div class="sub">Sign in to continue</div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password">
      </div>
      <button class="btn" id="loginBtn">Sign In</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div id="appRoot" style="display:none;">

  <header class="top">
    <div class="brand">
      <span class="eyebrow">Palm Partners &middot; Back Office Ops</span>
      <h1>Claim Activity Docket</h1>
    </div>
    <div class="date-nav">
      <button id="prevDay" title="Previous day">&#8249;</button>
      <div class="date-display" id="dateDisplay">—</div>
      <button id="nextDay" title="Next day">&#8250;</button>
      <button id="todayBtn" class="btn ghost small" style="margin-left:6px;">Today</button>
    </div>
  </header>

  <div id="staffArea">
    <div class="staff-tabs" id="staffTabs"></div>
  </div>

  <div class="sync-bar">
    <span><span class="sync-dot off" id="syncDot"></span><span id="syncLabel">Checking connection…</span></span>
    <span><span id="totalToday"></span> &nbsp; <button class="logout-link" id="logoutBtn">Log out</button></span>
  </div>

  <div class="tabs">
    <button class="active" data-view="day">Today's Docket</button>
    <button data-view="week">This Week</button>
    <button data-view="byday">By Day</button>
    <button data-view="all">Full Log</button>
    <button id="exportBtn" class="btn ghost small" style="margin-left:auto;">Export CSV</button>
  </div>

  <div class="docket-panel" id="reportPanel">
    <div class="panel-head">Generate Report</div>
    <div class="report-controls">
      <div class="field">
        <label>Period</label>
        <select id="reportPeriod">
          <option value="week">Weekly</option>
          <option value="biweek">Bi-Weekly</option>
          <option value="month">Monthly</option>
        </select>
      </div>
      <div class="field">
        <label>Anchor date</label>
        <input type="date" id="reportDate">
      </div>
      <button class="btn" id="generateReportBtn">Generate</button>
      <button class="btn ghost small hidden" id="copyReportBtn">Copy to Clipboard</button>
      <span class="copy-confirm" id="copyConfirm"></span>
    </div>
    <textarea id="reportOutput" class="report-output hidden" readonly></textarea>
  </div>

  <div class="tally" id="tallyStrip"></div>

  <div class="docket-panel">
    <div class="panel-head">Log an entry</div>
    <div class="add-form">
      <div class="field">
        <label>Staff</label>
        <select id="staffSelect"></select>
      </div>
      <div class="field">
        <label>State</label>
        <select id="stateSelect">
          <option value="">—</option>
          <option value="NC">NC</option>
          <option value="SC">SC</option>
          <option value="FL">FL</option>
        </select>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field">
        <label>Category</label>
        <div style="display:flex;gap:6px;align-items:center;">
          <select id="catSelect"></select>
          <button type="button" class="btn ghost small" id="catAddToggle" title="Add a new category">+ New</button>
        </div>
        <div class="cat-add-row hidden" id="catAddRow">
          <input type="text" id="newCatName" placeholder="New category name">
          <button class="btn ghost small" id="newCatSave">Save</button>
        </div>
      </div>
      <div class="field grow">
        <label>Description</label>
        <input type="text" id="descInput" placeholder="e.g. Demand sent — claim #12345, GMA Law">
      </div>
      <div class="field count">
        <label>Count</label>
        <input type="number" id="countInput" value="1" min="1">
      </div>
      <button class="btn" id="addBtn">Log it</button>
    </div>
  </div>

  <div id="viewArea"></div>

  </div>

</div>

<script>
/* ============ CONFIG ============
   Paste your Supabase project details below.
   Create a free project at https://supabase.com, then run the SQL
   from setup.sql (provided alongside this file) in the SQL editor.
==================================== */
const SUPABASE_URL = 'https://larnctjihbiirijrfikf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxhcm5jdGppaGJpaXJpanJmaWtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTQ2MjQsImV4cCI6MjEwMDQ3MDYyNH0.aYEFKmRberxAMFD69qnu3GiBxtBm9ZQQQenjnY6Znf4';

const CATEGORIES = [
  { id:'email',       label:'Emails Sent',       color:'var(--cat-email)' },
  { id:'received',    label:'Emails Received/Triaged', color:'var(--cat-received)' },
  { id:'demand',      label:'Demand Letters',    color:'var(--cat-demand)' },
  { id:'spol',        label:'SPOL / Proof of Loss', color:'var(--cat-spol)' },
  { id:'litigation',  label:'Litigation Handoff',color:'var(--cat-litigation)' },
  { id:'appraisal',   label:'Appraisal Award',   color:'var(--cat-appraisal)' },
  { id:'carrier',     label:'Carrier Contact',   color:'var(--cat-carrier)' },
  { id:'sfupload',    label:'SF Upload / Doc Processing', color:'var(--cat-sfupload)' },
  { id:'other',       label:'Other',             color:'var(--cat-other)' },
];

// Custom categories staff add themselves get appended here at runtime (private to whoever added them).
let customCategories = [];
let ALL_CATEGORIES = CATEGORIES.slice();
let catMap = Object.fromEntries(ALL_CATEGORIES.map(c=>[c.id,c]));
function rebuildCategoryState(){
  // Admin (Charissa) keeps the built-in claims categories as defaults, plus any custom ones.
  // Non-admin staff start with a blank slate — only categories they've added themselves.
  ALL_CATEGORIES = isAdmin ? [...CATEGORIES, ...customCategories] : [...customCategories];
  catMap = Object.fromEntries([...CATEGORIES, ...customCategories].map(c=>[c.id,c])); // keep full map for label lookups regardless
}

// Add or remove names here as your team changes. Must match the staff_id values
// you set up in the staff_profiles table.
const STAFF = [
  { id:'charissa', label:'Charissa' },
  { id:'camille',  label:'Camille' },
  { id:'jean',     label:'Jean' },
];
let currentStaff = STAFF[0].id;

// Auth state — populated after sign-in
let session = null;
let myProfile = null;      // { user_id, staff_id, display_name, is_admin }
let isAdmin = false;

const CUSTOM_CAT_PALETTE = ['#8A5C4E','#3E6B5C','#5C6B8A','#8A7A3E','#6E4E7A','#4E6E7A'];

let sbClient = null;
let usingSupabase = false;
try{
  if(SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 10){
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    usingSupabase = true;
  }
}catch(e){ console.warn('Supabase init failed', e); }

/* ---------- local fallback storage (used until Supabase is configured) ---------- */
const LOCAL_KEY = 'claimActivityDocket_entries';
function loadLocal(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); }catch(e){ return []; }
}
function saveLocal(entries){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(entries)); }catch(e){}
}

let entries = [];
let currentDate = new Date();
let currentView = 'day';
let activeFilter = null;

// Entries logged before the staff feature existed have no `staff` field —
// treat those as belonging to the first staff member (Charissa) so nothing is lost.
function staffEntries(){
  return entries.filter(e => (e.staff || STAFF[0].id) === currentStaff);
}

function pad(n){ return String(n).padStart(2,'0'); }
function toKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isSameDay(a,b){ return toKey(a)===toKey(b); }

function fmtDateDisplay(d){
  const opts = { weekday:'short', month:'short', day:'numeric', year:'numeric' };
  const str = d.toLocaleDateString('en-US', opts);
  const todayStr = new Date().toLocaleDateString('en-US', opts);
  return str + (str===todayStr ? ' <span class="today-pill">TODAY</span>' : '');
}

async function fetchEntries(){
  if(usingSupabase){
    const { data, error } = await sbClient
      .from('activity_entries')
      .select('*')
      .order('created_at', { ascending:true });
    if(error){
      console.error(error);
      setSyncStatus(false, 'Connection error — check console');
      entries = [];
      return;
    }
    entries = data || [];
    setSyncStatus(true, 'Synced to Supabase');
  } else {
    entries = [];
    setSyncStatus(false, 'Supabase not configured');
  }
}

function setSyncStatus(ok, label){
  document.getElementById('syncDot').className = 'sync-dot ' + (ok ? 'ok':'off');
  document.getElementById('syncLabel').textContent = label;
}

async function addEntry({category, description, count, source, dateStr, staff, state}){
  const now = new Date();
  const entry = {
    date: dateStr || toKey(currentView==='day' ? currentDate : now),
    category, description, count: count||1, source: source||'manual',
    staff: staff || currentStaff,
    state: state || null,
    created_at: now.toISOString()
  };
  if(!usingSupabase){ alert('Supabase is not configured in this file.'); return; }
  const { data, error } = await sbClient.from('activity_entries').insert(entry).select();
  if(error){ console.error(error); alert('Could not save — check console (you may not have permission to log for this staff member).'); return; }
  entries.push(data[0]);
  render();
}

async function deleteEntry(id){
  if(usingSupabase){
    const { error } = await sbClient.from('activity_entries').delete().eq('id', id);
    if(error){ console.error(error); return; }
  }
  entries = entries.filter(e=>e.id!==id);
  render();
}
window.deleteEntry = deleteEntry;

/* ---------- populate category select ---------- */
function initCategorySelect(){
  const sel = document.getElementById('catSelect');
  sel.innerHTML = ALL_CATEGORIES.map(c=>`<option value="${c.id}">${c.label}</option>`).join('');
  if(ALL_CATEGORIES.length === 0){
    sel.innerHTML = `<option value="">No categories yet — click + New</option>`;
  }
}

async function fetchCustomCategories(){
  if(!usingSupabase || !session) { customCategories = []; rebuildCategoryState(); return; }
  const { data, error } = await sbClient.from('custom_categories').select('*');
  if(error){ console.error(error); customCategories = []; }
  else {
    customCategories = (data||[]).map(row => ({ id: row.cat_id, label: row.label, color: row.color }));
  }
  rebuildCategoryState();
}

async function addCustomCategory(label){
  const catId = 'custom_' + label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) || ('custom_'+Date.now());
  const color = CUSTOM_CAT_PALETTE[customCategories.length % CUSTOM_CAT_PALETTE.length];
  if(!usingSupabase || !session){ alert('Sign in first to add a category.'); return null; }
  const { data, error } = await sbClient.from('custom_categories')
    .insert({ user_id: session.user.id, cat_id: catId, label, color })
    .select();
  if(error){
    if(error.code === '23505'){ alert('You already have a category by that name.'); }
    else { console.error(error); alert('Could not save the new category — check console.'); }
    return null;
  }
  await fetchCustomCategories();
  initCategorySelect();
  return catId;
}

/* ---------- report generation ---------- */
function computePeriodRange(type, refDateStr){
  const ref = new Date(refDateStr + 'T00:00:00');
  let start, end, label;
  if(type === 'month'){
    start = new Date(ref.getFullYear(), ref.getMonth(), 1);
    end = new Date(ref.getFullYear(), ref.getMonth()+1, 0);
    label = start.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  } else {
    const dow = ref.getDay();
    const monday = new Date(ref); monday.setDate(ref.getDate() - ((dow+6)%7));
    if(type === 'biweek'){
      start = new Date(monday); start.setDate(monday.getDate()-7);
      end = new Date(monday); end.setDate(monday.getDate()+6);
    } else { // week
      start = monday;
      end = new Date(monday); end.setDate(monday.getDate()+6);
    }
    label = `${toKey(start)} to ${toKey(end)}`;
  }
  return { start, end, label };
}

function generateReportText(){
  const type = document.getElementById('reportPeriod').value;
  const refDateStr = document.getElementById('reportDate').value || toKey(currentDate);
  const { start, end, label } = computePeriodRange(type, refDateStr);
  const startKey = toKey(start), endKey = toKey(end);

  const staffLabel = (STAFF.find(s=>s.id===currentStaff)||STAFF[0]).label;
  const periodTypeLabel = type === 'week' ? 'Weekly' : type === 'biweek' ? 'Bi-Weekly' : 'Monthly';

  const inRange = staffEntries().filter(e => e.date >= startKey && e.date <= endKey);

  // Category totals
  const totals = {};
  ALL_CATEGORIES.forEach(c => totals[c.id] = 0);
  inRange.forEach(e => { totals[e.category] = (totals[e.category]||0) + Number(e.count||1); });

  let out = `Claim Activity Report — ${staffLabel}\n`;
  out += `Period: ${periodTypeLabel} (${label})\n`;
  out += `\nCATEGORY TOTALS\n`;
  ALL_CATEGORIES.forEach(c=>{
    out += `${c.label}: ${totals[c.id]}\n`;
  });
  const grandTotal = Object.values(totals).reduce((a,b)=>a+b,0);
  out += `Total: ${grandTotal}\n`;

  out += `\nDAY-BY-DAY BREAKDOWN\n`;
  const header = ['Date', ...ALL_CATEGORIES.map(c=>c.label), 'Total'];
  out += header.join(' | ') + '\n';

  const days = [];
  const cursor = new Date(start);
  while(cursor <= end){
    days.push(toKey(cursor));
    cursor.setDate(cursor.getDate()+1);
  }
  days.forEach(dateKey=>{
    const dayEntries = inRange.filter(e=>e.date===dateKey);
    const dayCounts = {};
    ALL_CATEGORIES.forEach(c=>dayCounts[c.id]=0);
    dayEntries.forEach(e=>{ dayCounts[e.category] = (dayCounts[e.category]||0) + Number(e.count||1); });
    const dayTotal = Object.values(dayCounts).reduce((a,b)=>a+b,0);
    const row = [dateKey, ...ALL_CATEGORIES.map(c=>dayCounts[c.id]), dayTotal];
    out += row.join(' | ') + '\n';
  });

  return out;
}

function csvEscape(val){
  const s = String(val ?? '');
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function toCSV(rows){
  const header = ['Date','Staff','State','Category','Description','Count','Source'];
  const lines = [header.join(',')];
  rows.forEach(e=>{
    const cat = (catMap[e.category] || catMap.other).label;
    const staffLabel = (STAFF.find(s=>s.id===(e.staff||STAFF[0].id))||STAFF[0]).label;
    lines.push([e.date, staffLabel, e.state||'', cat, e.description||'', e.count||1, e.source||'manual'].map(csvEscape).join(','));
  });
  return lines.join('\n');
}

function downloadCSV(filename, rows){
  const csv = toCSV(rows);
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const staffLabel = (STAFF.find(s=>s.id===currentStaff)||STAFF[0]).label.toLowerCase();
  if(currentView === 'byday'){
    const byDate = {};
    staffEntries().forEach(e=>{
      if(!byDate[e.date]) byDate[e.date] = {};
      byDate[e.date][e.category] = (byDate[e.date][e.category]||0) + Number(e.count||1);
    });
    const dates = Object.keys(byDate).sort();
    const header = ['Date', ...ALL_CATEGORIES.map(c=>c.label), 'Total'];
    const lines = [header.map(csvEscape).join(',')];
    dates.forEach(dateKey=>{
      let total = 0;
      const cells = ALL_CATEGORIES.map(c=>{
        const n = byDate[dateKey][c.id] || 0;
        total += n;
        return n;
      });
      lines.push([dateKey, ...cells, total].map(csvEscape).join(','));
    });
    const csv = lines.join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `claim-activity_${staffLabel}_by-day.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return;
  }
  let rows, label;
  const mine = staffEntries();
  if(currentView === 'day'){
    rows = mine.filter(e=>e.date===toKey(currentDate));
    label = toKey(currentDate);
  } else if(currentView === 'week'){
    const start = new Date(currentDate);
    const dow = start.getDay();
    const monday = new Date(start); monday.setDate(start.getDate() - ((dow+6)%7));
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const mondayKey = toKey(monday), sundayKey = toKey(sunday);
    rows = mine.filter(e=> e.date >= mondayKey && e.date <= sundayKey);
    label = `week_${mondayKey}_to_${sundayKey}`;
  } else {
    rows = mine.slice();
    label = 'full-log';
  }
  rows.sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
  downloadCSV(`claim-activity_${staffLabel}_${label}.csv`, rows);
});

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}

(async function init(){
  if(usingSupabase){
    const { data } = await sbClient.auth.getSession();
    session = data.session;
  }
  if(session){
    await afterLogin();
  }
  // otherwise: stay on the login screen until the user signs in
})();
</script>
