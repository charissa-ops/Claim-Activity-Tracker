<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Import: July Activity</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 20px;color:#2A2E35;}
  h1{font-size:20px;}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:14px;}
  .status{margin-top:20px;padding:12px;border-radius:6px;font-size:14px;}
  .ok{background:#eaf3ea;color:#2c4f2e;}
  .err{background:#fbeceb;color:#7a2a20;}
  button{background:#1B2A4A;color:#fff;border:none;padding:10px 18px;border-radius:4px;cursor:pointer;font-size:14px;margin-top:16px;}
  button:disabled{opacity:.5;cursor:default;}
</style>
</head>
<body>
<h1>Import — July 2026 activity (from Gmail)</h1>
<p>This will insert the summary rows below into your <code>activity_entries</code> table, dated 2026-07-24. Run this once.</p>
<div id="rows"></div>
<button id="go">Insert into Supabase</button>
<div id="status"></div>

<script>
const SUPABASE_URL = 'https://larnctjihbiirijrfikf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxhcm5jdGppaGJpaXJpanJmaWtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTQ2MjQsImV4cCI6MjEwMDQ3MDYyNH0.aYEFKmRberxAMFD69qnu3GiBxtBm9ZQQQenjnY6Znf4';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Derived from Gmail sent-mail activity, July 1–24, 2026.
// "Emails" = total sent threads (201) minus the specifically-categorized ones below.
const entries = [
  { date:'2026-07-24', category:'email',      description:'General claim correspondence sent this month (carrier updates, SF file notes, internal PA coordination)', count:171, source:'session' },
  { date:'2026-07-24', category:'demand',     description:'Appraisal demand packages sent (e.g. Rose Seekamp, Helm/State Farm, Travelers JGC7070/JGC4890, USAA, ASI, Universal Property, Slide Ins.)', count:11, source:'session' },
  { date:'2026-07-24', category:'other',      description:'Appraisal demand withdrawal — Alberta & Bobby Capenter, Claim #7009569074-1-1', count:1, source:'session' },
  { date:'2026-07-24', category:'spol',       description:'SPOL / Proof of Loss items sent (e.g. Rose Seekamp claim #01000148011)', count:5, source:'session' },
  { date:'2026-07-24', category:'appraisal',  description:'Appraisal-related activity (awards, appraiser designation, acknowledgments)', count:8, source:'session' },
  { date:'2026-07-24', category:'litigation', description:'Litigation handoffs — subpoenas/depositions (Ronald Dimaio v. State Farm, Sayed Harun v. State Farm) + attorney file-shares (WEK Law, Spector Rosenbaum, Bernstein Chackman)', count:6, source:'session' },
];

const rowsDiv = document.getElementById('rows');
entries.forEach(e=>{
  const r = document.createElement('div');
  r.className='row';
  r.innerHTML = `<span>${e.category} — ${e.description}</span><strong>${e.count}</strong>`;
  rowsDiv.appendChild(r);
});

document.getElementById('go').addEventListener('click', async ()=>{
  const btn = document.getElementById('go');
  btn.disabled = true;
  btn.textContent = 'Inserting…';
  const statusDiv = document.getElementById('status');
  const { data, error } = await supabase.from('activity_entries').insert(entries).select();
  if(error){
    statusDiv.className = 'status err';
    statusDiv.textContent = 'Error: ' + error.message + ' — make sure setup.sql has been run in your Supabase project first.';
    btn.disabled = false;
    btn.textContent = 'Retry';
  } else {
    statusDiv.className = 'status ok';
    statusDiv.textContent = `Inserted ${data.length} rows. You can now open your Claim Activity Docket to see them.`;
    btn.textContent = 'Done';
  }
});
</script>
</body>
</html>
